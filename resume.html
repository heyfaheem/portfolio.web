<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RESUME</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { min-height: 100vh; background: #000; color: #fff; font-family: "Segoe UI", Arial, sans-serif; padding: 40px 20px; }
        .wrap { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; font-size: 44px; letter-spacing: 6px; margin-bottom: 10px;
             background: linear-gradient(90deg, #ff8a1f, #fff1d6, #2fe0f0);
             -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .sub { text-align: center; color: #bbb; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
        .card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; padding: 22px;
                text-decoration: none; color: #fff; transition: border-color .3s, transform .3s; display: block; }
        .card:hover { border-color: #ff8a1f; transform: translateY(-4px); }
        .card h3 { color: #ff8a1f; margin-bottom: 8px; font-size: 16px; letter-spacing: 1px; }
        .card p { color: #ccc; font-size: 14px; line-height: 1.5; }
        .btn { display: inline-block; background: #d4981a; color: #000; padding: 12px 28px; border-radius: 6px;
               text-decoration: none; font-weight: 600; border: none; cursor: pointer; font-size: 15px; }
        .center { text-align: center; margin-top: 40px; }
        .back { display: inline-block; margin-bottom: 30px; color: #bbb; text-decoration: none; }
        .back:hover { color: #ff8a1f; }
    </style>
</head>
<body>
<div class="wrap">
    <a class="back" href="port.html">&larr; Back to Home</a>
    <h1>RESUME</h1>
    <p class="sub">My education and background.</p>

    <div class="grid">
        <!-- COPY one whole card to add a new section -->
        <div class="card">
            <h3>EDUCATION</h3>
            <p>B.E. Computer Science<br>Saveetha Engineering College<br>2026 - 2027</p>
        </div>
    </div>
</div>
</body>
</html>
